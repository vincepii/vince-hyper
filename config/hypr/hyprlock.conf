general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(7aa2f7ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(24283bee)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(e0af68ee)
    position = 0, -60
    halign = center
    valign = center
}
