source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $lock_bg
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $lock_fg
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $lock_accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $lock_accent
    inner_color = $lock_surface
    font_color = $lock_fg
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = $lock_check
    fail_color = $lock_fail
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $lock_capslock
    position = 0, -60
    halign = center
    valign = center
}
