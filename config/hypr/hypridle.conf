general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Warn 30 seconds before locking (4.5 min)
listener {
    timeout = 270
    on-timeout = $HOME/.local/bin/lock-countdown start
    on-resume = $HOME/.local/bin/lock-countdown cancel
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/lock-countdown stop; loginctl lock-session
}

# Turn off displays after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
